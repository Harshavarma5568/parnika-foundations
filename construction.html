
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parnika Foundations | The Making of a Home</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#073B3A;
  color:#F5F3E9;
  font-family:Arial,sans-serif;
  overflow:hidden;
}
#scene{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}
.overlay{
  position:fixed;
  inset:0;
  pointer-events:none;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:35px 6%;
  background:linear-gradient(90deg,#052e2e99,transparent 75%),
             linear-gradient(0deg,#052e2eaa,transparent 35%);
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.brand{
  font-size:13px;
  letter-spacing:4px;
  font-weight:bold;
}
.brand span{color:#C7E36B}
.back{
  pointer-events:auto;
  color:#F5F3E9;
  text-decoration:none;
  font-size:11px;
  letter-spacing:2px;
  border:1px solid #ffffff55;
  padding:12px 18px;
}
.content{
  max-width:480px;
  margin-top:auto;
  margin-bottom:60px;
}
.eyebrow{
  color:#C7E36B;
  font-size:10px;
  letter-spacing:4px;
}
h1{
  font-size:clamp(42px,6vw,78px);
  line-height:.98;
  letter-spacing:-4px;
  font-weight:500;
  margin:22px 0;
}
h1 em{
  font-family:Georgia,serif;
  color:#C7E36B;
  font-weight:normal;
}
.description{
  color:#c4d8cd;
  font-size:13px;
  line-height:1.9;
  max-width:360px;
}
.status{
  margin-top:30px;
  display:flex;
  justify-content:space-between;
  max-width:350px;
  font-size:9px;
  letter-spacing:2px;
  color:#d6e1d7;
}
.track{
  width:350px;
  max-width:100%;
  height:2px;
  background:#ffffff30;
  margin-top:12px;
}
#progress{
  width:0%;
  height:100%;
  background:#C7E36B;
}
.controls{
  pointer-events:auto;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:24px;
}
button{
  cursor:pointer;
  padding:14px 20px;
  border:1px solid #C7E36B;
  background:#C7E36B;
  color:#073B3A;
  font-size:10px;
  font-weight:bold;
  letter-spacing:1px;
}
button.secondary{
  background:transparent;
  color:#F5F3E9;
  border-color:#ffffff65;
}
.hint{
  position:fixed;
  right:6%;
  bottom:45px;
  font-size:9px;
  letter-spacing:2px;
  color:#d3ded3;
  pointer-events:none;
}
@media(max-width:650px){
  .overlay{padding:23px 6%}
  .content{margin-bottom:80px}
  h1{font-size:49px}
  .hint{display:none}
  .description{max-width:290px}
}
</style>
</head>

<body>

<canvas id="scene"></canvas>

<div class="overlay">
  <div class="top">
    <div class="brand">PARNIKA <span>FOUNDATIONS</span></div>
    <a class="back" href="index.html">← WEBSITE</a>
  </div>

  <div class="content">
    <div class="eyebrow">THE ART OF BUILDING</div>
    <h1>Every home<br>starts with <em>one piece.</em></h1>
    <p class="description">
      Watch a vision take shape, one carefully placed element
      at a time. From the first foundation block to the final roof.
    </p>

    <div class="status">
      <span id="phase">PREPARING FOUNDATION</span>
      <span id="percentage">00%</span>
    </div>

    <div class="track"><div id="progress"></div></div>

    <div class="controls">
      <button id="restart">REPLAY EXPERIENCE ↗</button>
      <button id="pause" class="secondary">PAUSE</button>
    </div>
  </div>
</div>

<div class="hint">3D ARCHITECTURE · PARNIKA</div>

<script type="module">
import * as THREE from 'three';

const canvas = document.querySelector('#scene');
const scene = new THREE.Scene();
scene.background = new THREE.Color('#073B3A');
scene.fog = new THREE.Fog('#073B3A',18,38);

const camera = new THREE.PerspectiveCamera(38,1,.1,100);
camera.position.set(9,7,11);

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias:true
});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.25;

scene.add(new THREE.HemisphereLight('#fff2d7','#29463b',2.3));

const sun=new THREE.DirectionalLight('#ffe3b0',3.5);
sun.position.set(-7,12,8);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

const fill=new THREE.PointLight('#80d5bd',2,25);
fill.position.set(5,5,-5);
scene.add(fill);

const world=new THREE.Group();
scene.add(world);

const mat=(color,roughness=.75,metalness=0)=>
 new THREE.MeshStandardMaterial({color,roughness,metalness});

const concrete=mat('#d0cabb');
const white=mat('#eee9dd');
const brick=mat('#b9663e');
const roofMat=mat('#344c42');
const wood=mat('#936747');
const metal=mat('#c59b5e',.35,.55);
const glass=new THREE.MeshPhysicalMaterial({
 color:'#80bdb3',
 roughness:.15,
 metalness:.1,
 transparent:true,
 opacity:.8
});
const green=mat('#477b58');

const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(40,40),
 mat('#174238')
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-.18;
floor.receiveShadow=true;
world.add(floor);

const grid=new THREE.GridHelper(30,30,'#759681','#426754');
grid.position.y=-.16;
grid.material.transparent=true;
grid.material.opacity=.15;
world.add(grid);

const pieces=[];
let order=0;

function piece(x,y,z,w,h,d,material,group='structure'){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  material
 );
 const target=new THREE.Vector3(x,y,z);
 const direction=new THREE.Vector3(
  Math.sin(order*2.2),
  1,
  Math.cos(order*1.4)
 ).normalize();

 const start=target.clone().add(direction.multiplyScalar(5+order%3));
 mesh.position.copy(start);
 mesh.castShadow=true;
 mesh.receiveShadow=true;

 mesh.userData={
  target,
  start,
  order:order++,
  group
 };

 pieces.push(mesh);
 world.add(mesh);
 return mesh;
}

/* FOUNDATION */

for(let x=-2.4;x<=2.4;x+=.8){
 for(let z=-1.8;z<=1.8;z+=.9){
  piece(x,.08,z,.78,.2,.87,concrete,'foundation');
 }
}

/* WALLS */

for(let row=0;row<6;row++){
 for(let col=-3;col<=3;col++){
  const x=col*.8;
  if(Math.abs(x)<.55&&row<4)continue;
  if(Math.abs(x)> .7&&Math.abs(x)<1.7&&row>=2&&row<=3)continue;

  piece(
   x,.32+row*.43,1.95,
   .76,.41,.23,
   row%2?concrete:brick,
   'walls'
  );
 }
}

for(const side of [-1,1]){
 for(let row=0;row<6;row++){
  for(let z=-1.5;z<=1.5;z+=.8){
   piece(side*2.4,.32+row*.43,z,.23,.41,.76,concrete,'walls');
  }
 }
}

for(let row=0;row<6;row++){
 for(let col=-3;col<=3;col++){
  piece(col*.8,.32+row*.43,-1.95,.76,.41,.23,concrete,'walls');
 }
}

/* PILLARS */

for(const x of [-2.4,2.4]){
 piece(x,1.6,1.95,.3,3.2,.3,white,'structure');
}

/* DOOR */

piece(0,1.05,2.1,.9,2.1,.12,wood,'finishing');

/* WINDOWS */

for(const x of [-1.25,1.25]){
 piece(x,1.9,2.1,.86,.95,.06,glass,'finishing');
}

/* ROOF AND CANOPY */

piece(0,3.1,0,5.4,.25,4.5,roofMat,'roof');
piece(0,3.27,0,5.15,.12,4.3,white,'roof');
piece(0,3.05,2.3,5.6,.18,.25,metal,'roof');

/* BALCONY */

piece(.4,2.55,2.5,2.4,.13,1,metal,'finishing');
piece(.4,2.9,3,2.4,.07,.07,white,'finishing');

/* STEPS */

for(let i=0;i<3;i++){
 piece(0,.2-i*.05,2.6+i*.38,1.6-i*.2,.12,.36,white,'finishing');
}

/* TREES */

function tree(x,z){
 piece(x,.55,z,.12,1.1,.12,wood,'landscape');

 const crown=new THREE.Mesh(
  new THREE.IcosahedronGeometry(.65,1),
  green
 );
 crown.position.set(x,1.5,z);
 crown.castShadow=true;

 const target=crown.position.clone();
 crown.position.add(new THREE.Vector3(0,5,0));

 crown.userData={
  target,
  start:crown.position.clone(),
  order:order++,
  group:'landscape'
 };

 pieces.push(crown);
 world.add(crown);
}

tree(-3.5,1.2);
tree(3.5,1.2);
tree(-3.5,-2.3);
tree(3.5,-2.3);

/* TIMELINE */

const phase=document.querySelector('#phase');
const percentage=document.querySelector('#percentage');
const progress=document.querySelector('#progress');
const pauseButton=document.querySelector('#pause');

const buildDuration=13;
const completedHold=2.5;
const dismantleDuration=10;
const cycleDuration=buildDuration+completedHold+dismantleDuration+2;

let startTime=performance.now();
let paused=false;
let pauseTime=0;
let rotation=0;
let dragging=false;
let lastX=0;

function reset(){
 startTime=performance.now();
 paused=false;
 pauseButton.textContent='PAUSE';
 pieces.forEach(p=>{
  p.position.copy(p.userData.start);
  p.scale.setScalar(.75);
 });
}

document.querySelector('#restart').addEventListener('click',reset);

pauseButton.addEventListener('click',()=>{
 paused=!paused;
 if(paused){
  pauseTime=performance.now();
  pauseButton.textContent='RESUME';
 }else{
  startTime+=performance.now()-pauseTime;
  pauseButton.textContent='PAUSE';
 }
});

canvas.addEventListener('pointerdown',e=>{
 dragging=true;
 lastX=e.clientX;
 canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove',e=>{
 if(!dragging)return;
 rotation+=(e.clientX-lastX)*.006;
 lastX=e.clientX;
});

canvas.addEventListener('pointerup',()=>dragging=false);
canvas.addEventListener('pointercancel',()=>dragging=false);

const ease=t=>1-Math.pow(1-t,3);

function animate(now){
 requestAnimationFrame(animate);

 if(!paused){
  const elapsed=((now-startTime)/1000)%cycleDuration;

  let building=elapsed<buildDuration;
  let completed=elapsed>=buildDuration&&elapsed<buildDuration+completedHold;
  let dismantling=elapsed>=buildDuration+completedHold&&elapsed<buildDuration+completedHold+dismantleDuration;

  let overall=0;

  if(building){
   phase.textContent='ASSEMBLING YOUR HOME';
   overall=elapsed/buildDuration;
  }else if(completed){
   phase.textContent='YOUR HOME IS COMPLETE';
   overall=1;
  }else if(dismantling){
   phase.textContent='EXPLODED VIEW · DISASSEMBLING';
   overall=1-(elapsed-buildDuration-completedHold)/dismantleDuration;
  }else{
   phase.textContent='PREPARING NEXT BUILD';
   overall=0;
  }

  const percent=Math.round(overall*100);
  percentage.textContent=String(percent).padStart(2,'0')+'%';
  progress.style.width=percent+'%';

  pieces.forEach(p=>{
   const sequence=p.userData.order;
   const delay=sequence*.035;

   const buildProgress=THREE.MathUtils.clamp(
    (elapsed-delay)/buildDuration,0,1
   );

   const detachStart=buildDuration+completedHold;
   const detachProgress=THREE.MathUtils.clamp(
    (elapsed-detachStart-delay*.35)/dismantleDuration,0,1
   );

   let position;

   if(elapsed<buildDuration){
    position=p.userData.start.clone().lerp(
     p.userData.target,
     ease(buildProgress)
    );
   }else if(completed){
    position=p.userData.target.clone();
   }else if(dismantling){
    position=p.userData.target.clone().lerp(
     p.userData.start,
     ease(detachProgress)
    );
   }else{
    position=p.userData.start.clone();
   }

   p.position.copy(position);

   const visible=building
    ? ease(buildProgress)
    : completed
      ? 1
      : dismantling
        ? 1-ease(detachProgress)
        : 0;

   p.scale.setScalar(.75+.25*visible);
  });
 }

 world.rotation.y+=(rotation-world.rotation.y)*.035;
 if(!dragging)rotation+=.00035;

 camera.lookAt(0,1.45,0);
 renderer.render(scene,camera);
}

function resize(){
 const w=canvas.clientWidth;
 const h=canvas.clientHeight;
 if(!w||!h)return;
 renderer.setSize(w,h,false);
 camera.aspect=w/h;
 camera.updateProjectionMatrix();
}

new ResizeObserver(resize).observe(canvas);
resize();
reset();
requestAnimationFrame(animate);

</script>
</body>
</html>
